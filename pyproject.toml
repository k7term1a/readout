[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "readout"
version = "0.3.1"
description = "Paper -> annotated reading page + editable lab-meeting slides (deck.json -> .pptx)"
requires-python = ">=3.9"
dependencies = ["python-pptx>=1.0", "Pillow>=9", "lxml"]

[project.scripts]
readout-slide = "build_deck:main"

[dependency-groups]
dev = ["pytest"]

# The renderer lives inside the skill folder so the skill stays self-contained on claude.ai.
[tool.setuptools]
py-modules = ["build_deck"]
package-dir = {"" = "skills/2slide/scripts"}
