[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-deck"
version = "0.2.0"
description = "Lab-meeting slide renderer: deck.json -> editable .pptx"
requires-python = ">=3.9"
dependencies = ["python-pptx>=1.0", "Pillow>=9", "lxml"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lab-deck-build = "build_deck:main"

# The renderer lives inside the skill folder so the skill stays self-contained on claude.ai.
[tool.setuptools]
py-modules = ["build_deck"]
package-dir = {"" = "skills/2slide/scripts"}
